name: Build Executables

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write  # Required to create releases
  packages: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
      
      - name: Build Windows executable
        run: python build_windows.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sims4ModOrganizer-Windows
          path: dist/Sims4ModOrganizer.exe

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Build macOS app
        run: python build_mac.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sims4ModOrganizer-macOS
          path: dist/Sims4ModOrganizer.app

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          sudo apt-get update
          sudo apt-get install -y python3-tk
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Build Linux binary
        run: python build_linux.py
      
      - name: Make binary executable
        run: chmod +x dist/sims4-mod-organizer
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sims4ModOrganizer-Linux
          path: dist/sims4-mod-organizer

  create-release:
    name: Create Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Sims4ModOrganizer-Windows/Sims4ModOrganizer.exe
            Sims4ModOrganizer-macOS/Sims4ModOrganizer.app/**/*
            Sims4ModOrganizer-Linux/sims4-mod-organizer
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

